spring.application.name=register

# ✅ Allow external devices (phone access)
server.address=0.0.0.0
server.port=8081

# ✅ MySQL config
spring.datasource.url=jdbc:mysql://localhost:3306/attendify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ✅ JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ✅ IMPORTANT: Prevent long blocking sessions
spring.jpa.open-in-view=false

# ✅ Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ✅ Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ✅ Logging (important for debugging)
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.attendance_Backend=DEBUG

# ✅ Show error messages
server.error.include-message=always

# ✅ JWT (keep as is)
app.jwt.secret=${JWT_SECRET:V3N5aW5WbVJzM2Q4eWQ5d0oyMmZwQ3F1U29KaHhlQW50QjQ5NWFxb1BuSA==}
app.jwt.expiration-ms=86400000

# ✅ Mail (optional)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true